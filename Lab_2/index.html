<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивна навігація</title>
    <style>
        /* Базові стилі */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav-menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background-color: #333;
            color: white;
        }

        .nav-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .nav-menu li {
            margin-right: 20px;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
        }

        .nav-menu a:hover {
            background-color: #555;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #333;
            min-width: 160px;
            z-index: 1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .search-form input {
            padding: 5px;
            margin-left: 10px;
        }

        /* Бургер-меню */
        .burger-menu {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 10px;
            background-color: #333;
            border: none;
        }

        .burger-menu div {
            width: 30px;
            height: 4px;
            background-color: white;
            margin: 5px 0;
        }

        /* Медіа-запити */
        @media (max-width: 992px) {
            .nav-menu {
                justify-content: space-between;
            }

            .nav-menu ul {
                display: none;
                flex-direction: column;
                width: 100%;
                background-color: #333;
                position: absolute;
                top: 60px;
                left: 0;
                padding: 20px;
            }

            .nav-menu ul li {
                margin: 15px 0;
                text-align: center;
            }

            .nav-menu.active ul {
                display: flex;
            }

            .burger-menu {
                display: flex;
            }

            .dropdown-content {
                position: static;
                display: none;
            }

            .dropdown:hover .dropdown-content {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .nav-menu ul li {
                font-size: 18px;
            }

            .search-form input {
                width: 80%;
            }
        }

        .logo {
            width: 200px;
            height: auto;
        }

    </style>
</head>
<body>
    <nav class="nav-menu">
        <div class="logo">
            <img src ="https://museum.mcsc.gov.ua/location/1516/iwOiv.jpg" width="200">
        </div>
        <ul>
            <li><a href="#">Головна</a></li>
            <li><a href="#">Про нас</a></li>
            <li class="dropdown">
                <a href="#">Послуги</a>
                <div class="dropdown-content">
                    <a href="#">Інтернет-маркетинг</a>
                    <a href="#">SEO</a>
                    <a href="#">Розробка сайтів</a>
                </div>
            </li>
            <li><a href="#">Контакти</a></li>
        </ul>
        <div class="search-form">
            <input type="text" placeholder="Пошук...">
        </div>
        <button class="burger-menu" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </button>
    </nav>

    <script>
        // Функція для відкриття/закриття бургер-меню
        function toggleMenu() {
            const menu = document.querySelector('.nav-menu');
            menu.classList.toggle('active');
        }
    </script>
</body>
</html>
