<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слайдер зображень</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        .slider-container {
            position: relative;
            max-width: 800px;
            margin: 50px auto;
            overflow: hidden;
            background: #fff;
            border-radius: 10px;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            display: none;
        }

        .slide.active {
            display: block;
        }

        button.prev, button.next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        button.prev { left: 10px; }
        button.next { right: 10px; }

        .dots {
            text-align: center;
            padding: 10px;
        }

        .dots span {
            height: 10px;
            width: 10px;
            margin: 0 5px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
        }

        .dots span.active {
            background-color: #717171;
        }

        .counter {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }

        .toggle-autoplay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div class="slider-container">
        <div class="slides">
            <img src="https://premiumtravel.kz/sites/default/files/karlshteyn.jpg" class="slide active" alt="Slide 1">
            <img src="https://www.tvrus.eu/wp-content/uploads/2024/07/saksoniya-anhalt.jpg" class="slide" alt="Slide 2">
            <img src="https://static.lusarealty.com/2018/07/shutterstock_795766858-1.jpg" class="slide" alt="Slide 3">
        </div>
        <button class="prev"><</button>
        <button class="next">></button>
        <div class="dots"></div>
        <div class="counter">1 / 3</div>
        <button class="toggle-autoplay">Старт</button>
    </div>

    <script>
        class ImageSlider {
            constructor() {
                this.slides = document.querySelectorAll('.slide');
                this.prevBtn = document.querySelector('.prev');
                this.nextBtn = document.querySelector('.next');
                this.dotsContainer = document.querySelector('.dots');
                this.counter = document.querySelector('.counter');
                this.autoplayBtn = document.querySelector('.toggle-autoplay');

                this.currentIndex = 0;
                this.interval = null;
                this.autoplay = false;

                this.init();
            }

            init() {
                this.createDots();
                this.updateSlider();
                this.prevBtn.addEventListener('click', () => this.changeSlide(-1));
                this.nextBtn.addEventListener('click', () => this.changeSlide(1));
                this.autoplayBtn.addEventListener('click', () => this.toggleAutoplay());

                this.dotsContainer.addEventListener('click', (e) => {
                    if (e.target.dataset.index) {
                        this.goToSlide(parseInt(e.target.dataset.index));
                    }
                });

                this.slidesContainer = document.querySelector('.slides');
                this.slidesContainer.addEventListener('touchstart', this.handleTouchStart.bind(this), false);
                this.slidesContainer.addEventListener('touchend', this.handleTouchEnd.bind(this), false);
            }

            createDots() {
                this.dotsContainer.innerHTML = '';
                this.slides.forEach((_, index) => {
                    const dot = document.createElement('span');
                    dot.dataset.index = index;
                    this.dotsContainer.appendChild(dot);
                });
            }

            updateSlider() {
                this.slides.forEach((slide, index) => {
                    slide.classList.toggle('active', index === this.currentIndex);
                });
                [...this.dotsContainer.children].forEach((dot, index) => {
                    dot.classList.toggle('active', index === this.currentIndex);
                });
                this.counter.textContent = `${this.currentIndex + 1} / ${this.slides.length}`;
            }

            changeSlide(direction) {
                this.currentIndex = (this.currentIndex + direction + this.slides.length) % this.slides.length;
                this.updateSlider();
            }

            goToSlide(index) {
                this.currentIndex = index;
                this.updateSlider();
            }

            toggleAutoplay() {
                this.autoplay = !this.autoplay;
                this.autoplayBtn.textContent = this.autoplay ? 'Пауза' : 'Старт';

                if (this.autoplay) {
                    this.interval = setInterval(() => this.changeSlide(1), 3000);
                } else {
                    clearInterval(this.interval);
                }
            }

            handleTouchStart(e) {
                this.xStart = e.changedTouches[0].clientX;
            }

            handleTouchEnd(e) {
                if (!this.xStart) return;
                let xEnd = e.changedTouches[0].clientX;
                let diff = xEnd - this.xStart;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) this.changeSlide(-1);
                    else this.changeSlide(1);
                }
                this.xStart = null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => new ImageSlider());
    </script>
</body>
</html>
