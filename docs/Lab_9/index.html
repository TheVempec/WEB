<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оптимізація продуктивності</title>

    <!-- Критичний CSS вбудований -->
    <style>
        /* Критичні стилі */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 1rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dark {
            background: #111;
            color: #eee;
        }
        .gallery {
            display: flex;
            gap: 0.5rem;
        }
        .gallery img {
            width: 100px;
            height: auto;
            display: block;
        }
    </style>

    <!-- Відкладене завантаження CSS -->
    <link rel="preload" href="styles.min.css" as="style"
          onload="this.onload=null;this.rel='stylesheet'">

    <!-- Оптимізація шрифтів -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Асинхронне завантаження JavaScript -->
    <script src="app.min.js" async defer></script>
</head>
<body>
    <!-- Перемикач теми -->
    <label>
        Темна тема:
        <input type="checkbox" id="themeToggle">
    </label>

    <!-- Форма збереження імені -->
    <form id="userForm">
        <input id="username" placeholder="Введіть ім'я">
        <button type="submit">Зберегти</button>
    </form>
    <div id="greeting"></div>

    <!-- Оптимізоване завантаження зображень -->
    <div class="gallery">
        <img src="placeholder.jpg"
             data-src="https://images.unsplash.com/photo-1497316730643-415fac54a2af?fm=jpg&q=60&w=300&ixlib=rb-4.0.3"
             loading="lazy"
             alt="Опис">
    </div>

    <!-- Відкладене завантаження контенту -->
    <div id="lazyContent">
        <!-- Контент для відкладеного завантаження -->
    </div>

    <!-- Динамічний контент API -->
    <section>
        <h2>Дані з API</h2>
        <pre id="apiData">Завантажую дані...</pre>
    </section>

    <!-- Реєстрація Service Worker для кешування -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker зареєстровано!'))
                .catch((err) => console.error('Помилка реєстрації Service Worker:', err));
        }

        // Налаштування теми
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            themeToggle.checked = true;
        }
        themeToggle.addEventListener('change', () => {
            if (themeToggle.checked) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        });

        // Збереження імені з форми
        const form = document.getElementById('userForm');
        const input = document.getElementById('username');
        const greeting = document.getElementById('greeting');

        form.addEventListener('submit', e => {
            e.preventDefault();
            localStorage.setItem('username', input.value);
            showGreeting();
        });

        function showGreeting() {
            const name = localStorage.getItem('username') || 'Гість';
            greeting.textContent = `Привіт, ${name}!`;
        }
        showGreeting();

        // Lazy-loading галереї через IntersectionObserver
        document.addEventListener('DOMContentLoaded', () => {
            const imgs = document.querySelectorAll('img[data-src]');
            const obs = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: '100px' });
            imgs.forEach(img => obs.observe(img));
        });

        // Кешування даних API у JS-кеш (Map)
        const jsCache = new Map();
        async function fetchWithCache(url) {
            if (jsCache.has(url)) return jsCache.get(url);
            try {
                const res = await fetch(url);
                if (!res.ok) {
                    throw new Error(`Network response was not ok: ${res.statusText}`);
                }
                const data = await res.json();
                jsCache.set(url, data);
                return data;
            } catch (error) {
                console.error('API запит не вдалося виконати:', error);
                document.getElementById('apiData').textContent = `Помилка завантаження даних: ${error.message}`;
                return null;
            }
        }

        // Виводимо динамічні дані (замінено на реальний API)
        fetchWithCache('https://jsonplaceholder.typicode.com/todos/1')
    .then(data => {
        if (data) {
            document.getElementById('apiData').innerHTML = `
                <p><strong>ID:</strong> ${data.id}</p>
                <p><strong>Заголовок:</strong> ${data.title}</p>
                <p><strong>Завершено:</strong> ${data.completed ? 'Так' : 'Ні'}</p>
            `;
        }
    });
    </script>
</body>
</html>
