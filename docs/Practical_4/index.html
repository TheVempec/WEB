<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивні елементи</title>
    <style>
        /* Стилі для модального вікна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 5px;
            width: 300px;
        }

        .active {
            display: flex;
        }

        /* Стилі для кнопки "вгору" */
        #scrollToTop {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        #scrollToTop:hover {
            background-color: #0056b3;
        }

        /* Стилі для випадаючого меню */
        #dropdownMenu {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        #dropdownMenu a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        #dropdownMenu a:hover {
            background-color: #ddd;
        }

        .dropdown {
            position: relative;
        }

        .dropdown:hover #dropdownMenu {
            display: block;
        }

        /* Стилі для форми */
        form {
            margin-top: 20px;
        }

        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .error {
            color: red;
            font-size: 12px;
        }

        #gallery {
            display: flex;
            justify-content: center; /* Центрує по горизонталі */
            align-items: center; /* Центрує по вертикалі */
            gap: 15px; /* Відстань між зображеннями */
            flex-wrap: wrap; /* Перехід на новий рядок */
        }

        .gallery-item {
            width: 300px; /* Ширина зображення */
            height: 200px; /* Висота зображення */
            object-fit: cover; /* Вирівнює зображення по центру і обрізає зайве */
            border-radius: 10px; /* Закруглені кути */
            cursor: pointer; /* Курсор при наведенні */
            transition: transform 0.3s ease-in-out; /* Анімація на ефект наведеня */
        }

        .gallery-item:hover {
            transform: scale(2.05); /* Збільшення при наведенні */
        }
    </style>
</head>
<body>

    <!-- Кнопка для відкриття модального вікна -->
    <button id="openModal">Відкрити модальне вікно</button>

    <!-- Модальне вікно -->
    <div class="modal">
        <div class="modal-content">
            <span id="closeModal">&times;</span>
            <h2>Модальне вікно</h2>
            <p>Це приклад модального вікна.</p>
        </div>
    </div>

    <!-- Форма зворотного зв'язку -->
    <h3>Форма зворотного зв'язку</h3>
    <form id="feedbackForm">
        <input type="text" id="name" placeholder="Ваше ім'я" required><br>
        <input type="email" id="email" placeholder="Ваш email" required><br>
        <textarea id="message" placeholder="Ваше повідомлення" required></textarea><br>
        <button type="submit">Відправити</button>
    </form>
    <div id="formFeedback" class="error"></div>

    <!-- Інтерактивна галерея зображень -->
    <h3>Галерея зображень</h3>
    <div id="gallery">
        <img src="https://premiumtravel.kz/sites/default/files/karlshteyn.jpg" alt="Image 1" class="gallery-item">
        <img src="https://lh3.googleusercontent.com/oTKPri3ctLS5b3bEwlSTWue4CHsVopBidf0Z_ytCHpR_QI83jYDHXSGPj7x7HgzZ2k0m0Q5CvWU3mwpXDJUd7rLTEbwUUDA7tbTfGh2p4fXp9AnvDKiO-QlANCplmMO30Qu16VoG2YHWSbyVu7Fp1_Lf4V9y2dmwpBbTq10yi3RFBL-c3ei4NLAjDuCQf1Br4SHPesiU7XyJiYT-J1rtfJo5EfHIn1v5PZiO44t0fYa1kY6jRi_fh7ZrI3o9_qLWl1N159__0LYTQXDHmCWhc9EhlvlJTcOXvuE5mBWckNtBMDecaOFZJaq22dtvrBhM3bnl_2SuHzi2-rQe0GesNWp4F0YlO4vnwBM-stZbv5fSJmAE-CcfScFAQM84wdkulwKPGNOaVNMXuhqMXqgyc88b56ZurxAGT-BpJ7Re6lVAYmx7CwTNe8Hql8Ongjkn6kxPczS212_EJme_kUrEzbNWGM7HYJO_tPw-_c1NBHvvofACECUskNRhTUnuitMnIuUqGz5fTrH_t80VvlBp36Bn59JmJedGZLgewpDw3UWnf0MW-evbnfHfWj8rKeVvTGUa=w993-h663-no" alt="Image 2" class="gallery-item">
        <img src="https://www.tvrus.eu/wp-content/uploads/2024/07/saksoniya-anhalt.jpg" alt="Image 3" class="gallery-item">
    </div>

    <!-- Випадаюче меню -->
    <div class="dropdown">
        <button>Меню</button>
        <div id="dropdownMenu">
            <a href="#">Пункт 1</a>
            <a href="#">Пункт 2</a>
            <a href="#">Пункт 3</a>
        </div>
    </div>

    <!-- Кнопка "вгору" -->
    <button id="scrollToTop">↑</button>

    <script>
        // Відкриття і закриття модального вікна
        document.getElementById('openModal').addEventListener('click', function() {
            document.querySelector('.modal').classList.add('active');
        });

        document.getElementById('closeModal').addEventListener('click', function() {
            document.querySelector('.modal').classList.remove('active');
        });

        // Валідація форми зворотного зв'язку
        document.getElementById('feedbackForm').addEventListener('submit', function(event) {
            event.preventDefault();
            let name = document.getElementById('name').value;
            let email = document.getElementById('email').value;
            let message = document.getElementById('message').value;

            // Перевірка заповнення полів
            if (name && email && message) {
                document.getElementById('formFeedback').textContent = 'Дякуємо за зворотній зв\'язок!';
                document.getElementById('formFeedback').style.color = 'green';
            } else {
                document.getElementById('formFeedback').textContent = 'Будь ласка, заповніть всі поля!';
                document.getElementById('formFeedback').style.color = 'red';
            }
        });

        // Показ / приховування кнопки "вгору"
        window.addEventListener('scroll', function() {
            if (window.scrollY > 200) {
                document.getElementById('scrollToTop').style.display = 'block';
            } else {
                document.getElementById('scrollToTop').style.display = 'none';
            }
        });

        // Перехід на верх сторінки при натисканні на кнопку "вгору"
        document.getElementById('scrollToTop').addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Інтерактивна галерея зображень
        let galleryItems = document.querySelectorAll('.gallery-item');
        galleryItems.forEach(function(item) {
            item.addEventListener('click', function() {
                alert('Ви вибрали зображення: ' + item.alt);
            });
        });
    </script>
</body>
</html>
