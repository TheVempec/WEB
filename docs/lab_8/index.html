<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Оптимізація зображень</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem;
    }

    h2 {
      margin-top: 2rem;
      border-bottom: 2px solid #ccc;
      padding-bottom: 0.3rem;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    .gallery img,
    .banner img,
    .icon img,
    .photo img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 5px;
    }

    .banner {
      margin-top: 1rem;
    }

    .banner img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .icons {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .icon img {
      width: 50px;
      height: 50px;
    }

    .background-section {
      margin-top: 2rem;
      height: 200px;
      background-image: url('images/istockphoto-1317323736-612x612.jpg');
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
    }

    /* Лазі лоадінг ефект */
    .lazy {
      filter: blur(15px);
      transition: filter 0.5s ease;
    }

    .lazy.loaded {
      filter: blur(0);
    }
  </style>
</head>
<body>

  <h1>Оптимізація зображень: різні типи</h1>

  <!-- Фотографії -->
  <section>
    <h2>Фотографії</h2>
    <picture class="lazy-picture" data-loaded="false">
      <source data-srcset="images/ny-no-2.webp" type="image/webp" />
      <source data-srcset="images/ny-no-2.jpg" type="image/jpeg" />
      <img class="lazy" data-src="images/ny-no-2.jpg" alt="Фотографія природи" width="600" height="400" />
    </picture>

    <picture class="lazy-picture" data-loaded="false">
      <source data-srcset="images/mountains-near-water-better-quality.webp" type="image/webp" />
      <source data-srcset="images/mountains-near-water-better-quality.jpg" type="image/jpeg" />
      <img class="lazy" data-src="images/mountains-near-water-better-quality.jpg" alt="Фотографія природи" width="600" height="400" />
    </picture>

  </section>

  <!-- Банери -->
  <section class="banner">
    <h2>Банери</h2>
    <picture class="lazy-picture" data-loaded="false">
      <source data-srcset="images/paysage-photo-astuce-1-684x1024.webp" type="image/webp" />
      <source data-srcset="images/paysage-photo-astuce-1-684x1024.jpg" type="image/jpeg" />
      <img class="lazy" data-src="images/paysage-photo-astuce-1-684x1024.jpg" alt="Банер рекламний" width="960" height="300" />
    </picture>
  </section>

  <!-- Іконки -->
  <section>
    <h2>Іконки</h2>
    <div class="icons">
      <picture class="lazy-picture" data-loaded="false" class="icon">
        <source data-srcset="images/906_emailsymbol.webp" type="image/webp" />
        <source data-srcset="images/906_emailsymbol.png" type="image/png" />
        <img class="lazy" data-src="images/906_emailsymbol.png" alt="Іконка 1" width="50" height="50" />
      </picture>
      <picture class="lazy-picture" data-loaded="false" class="icon">
        <source data-srcset="images/logo-icon-1.webp" type="image/webp" />
        <source data-srcset="images/logo-icon-1.png" type="image/png" />
        <img class="lazy" data-src="images/logo-icon-1.png" alt="Іконка 2" width="50" height="50" />
      </picture>
    </div>
  </section>

  <!-- Фонове зображення -->
  <section class="background-section">
    Фонове зображення з текстом зверху
  </section>

  <!-- Галерея зображень -->
  <section>
    <h2>Галерея зображень</h2>
    <div class="gallery">

      <picture class="lazy-picture" data-loaded="false">
        <source data-srcset="images/depositphotos_82843516-stock-photo-fantastic-mountain-lake.webp" type="image/webp" />
        <source data-srcset="images/depositphotos_82843516-stock-photo-fantastic-mountain-lake.jpg" type="image/jpeg" />
        <img class="lazy" data-src="images/depositphotos_82843516-stock-photo-fantastic-mountain-lake.jpg" alt="Галерея 1" width="300" height="200" />
      </picture>

      <picture class="lazy-picture" data-loaded="false">
        <source data-srcset="images/Landscape-Color.webp" type="image/webp" />
        <source data-srcset="images/Landscape-Color.jpg" type="image/jpeg" />
        <img class="lazy" data-src="images/Landscape-Color.jpg" alt="Галерея 2" width="300" height="200" />
      </picture>

      <picture class="lazy-picture" data-loaded="false">
        <source data-srcset="images/istockphoto-1317323736-612x612.webp" type="image/webp" />
        <source data-srcset="images/istockphoto-1317323736-612x612.jpg" type="image/jpeg" />
        <img class="lazy" data-src="images/istockphoto-1317323736-612x612.jpg" alt="Галерея 3" width="300" height="200" />
      </picture>

      <picture class="lazy-picture" data-loaded="false">
        <source data-srcset="images/mountains-near-water-better-quality.webp" type="image/webp" />
        <source data-srcset="images/mountains-near-water-better-quality.jpg" type="image/jpeg" />
        <img class="lazy" data-src="images/mountains-near-water-better-quality.jpg" alt="Галерея 4" width="300" height="200" />
      </picture>

    </div>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lazyPictures = document.querySelectorAll('.lazy-picture');

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const picture = entry.target;

            if (picture.dataset.loaded === "true") return;

            const sources = picture.querySelectorAll('source');
            sources.forEach(source => {
              const srcset = source.dataset.srcset;
              if (srcset) {
                source.setAttribute('srcset', srcset);
              }
            });

            const img = picture.querySelector('img.lazy');
            const imgSrc = img.dataset.src;
            if (imgSrc) {
              img.src = imgSrc;
              img.addEventListener('load', () => {
                img.classList.add('loaded');
              });
            }

            picture.dataset.loaded = "true";
            observer.unobserve(picture);
          }
        });
      });

      lazyPictures.forEach(picture => observer.observe(picture));
    });
  </script>
</body>
</html>
