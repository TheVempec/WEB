<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link >
  <title>Оптимізація зображень</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
    }

    .icon {
      width: 32px;
      height: 32px;
      fill: #333;
    }
  </style>
</head>
<body>

  <h1>Приклад оптимізованих зображень</h1>

  <!-- ✅ 1. Адаптивна фотографія з WebP та fallback -->
  <picture>
    <source
      srcset="images/4723250.webp 1920w,
              images/4723250.webp 1280w,
              images/4723250.webp 640w"
      sizes="(max-width: 640px) 100vw,
             (max-width: 1280px) 50vw,
             1920px"
      type="image/webp" />
    <source
      srcset="images/4723250.jpg 1920w,
              images/4723250.jpg 1280w,
              images/4723250.jpg 640w"
      sizes="(max-width: 640px) 100vw,
             (max-width: 1280px) 50vw,
             1920px"
      type="image/jpeg" />
    <img
      src="images/4723250s.jpg"
      alt="Пейзаж"
      loading="lazy"
      width="100%" />
  </picture>

  <!-- ✅ 2. PNG зображення з WebP fallback -->
  <picture>
    <source srcset="images/png-transparent-vector-flame-pentecost-fire-logo-thumbnail.webp" type="image/webp" />
    <img src="images/png-transparent-vector-flame-pentecost-fire-logo-thumbnail.png" alt="Логотип" loading="lazy" width="150" />
  </picture>

  <!-- ✅ 3. Векторне зображення SVG -->
  <h2>Векторна графіка</h2>
  <img src="images/kiwi.svg" alt="Ілюстрація" width="300" loading="lazy" />

  <!-- ✅ 4. Іконка зі спрайта SVG -->
  <h2>SVG Іконка зі спрайта</h2>
   <svg class="icon">
  <use xlink:href="#png-transparent-vector-flame-pentecost-fire-logo-thumbnail"></use>
</svg>
</body>
</html>
