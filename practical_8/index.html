<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оптимізація зображень</title>
  <style>
    .icon {
      width: 32px;
      height: 32px;
      fill: #333;
    }
  </style>
</head>
<body>

  
  <picture>
    <source
      srcset="images/640px.webp 640w,
              images/1280px.webp 1280w,
              images/1920px.webp 1920w"
      sizes="(max-width: 640px) 100vw,
             (max-width: 1280px) 50vw,
             1920px"
      type="image/webp">
    <img
      src="images/640px.jpg"
      srcset="images/640px.jpg 640w,
              images/1280px.jpg 1280w,
              images/1920px.jpg 1920w"
      sizes="(max-width: 640px) 100vw,
             (max-width: 1280px) 50vw,
             1920px"
      alt="Опис зображення"
      loading="lazy"
      width="100%"
      height="auto">
  </picture>

  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="sprite-icon-id" viewBox="0 0 24 24">
      <path d="M12 0C5.372 0 0 5.372 0 12s5.372 12 12 12 12-5.372 12-12S18.628 0 12 0zm5.707 8.293l-6.364 6.364a1 1 0 01-1.414 0l-3.182-3.182a1 1 0 111.414-1.414l2.475 2.475 5.657-5.657a1 1 0 111.414 1.414z"/>
    </symbol>
  </svg>

  <svg class="icon" aria-hidden="true">
    <use xlink:href="#sprite-icon-id"></use>
  </svg>

</body>
</html>
