<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слайдер зображень</title>
    <style>
        .container {
            padding: 2rem;
        }

        .slider-wrapper {
            position: relative;
            max-width: 48rem;
            margin: 0 auto;
        }

        .slider {
            display: flex;
            aspect-ratio: 16/9;
            overflow: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            box-shadow: 0 1.5rem, 3rem -0.75rem hsla(0, 0%, 0%, 0.25);
        }

        .slider img {
            flex: 1 0 100%;
            scroll-snap-align: start;
            object-fit: cover;
        }

        .slider-nav {
            display: flex;
            column-gap: 1rem;
            position: absolute;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        .slider-nav a {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background-color: #fff;
            opacity: 0.75;
            transition: opacity 250ms ease;
        }

        .slider-nav a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <section class="container">
        <div class="slider-wrapper">
            <div class="slider">
                <img id="slide-1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTE_zjOACDqBVBOTM08-u98GGTuR4zsqarNjg&s"/>
                <img id="slide-2" src="https://cdn.shortpixel.ai/client/q_glossy,ret_img/https://drevniebogi.ru/wp-content/uploads/2014/02/poseydon-s-trezubtsem.jpg"/>
                <img id="slide-3" src="https://www.prostolife.com.ua/wp-content/uploads/2024/06/illustrations_to_books_men_monsters_war_of_the_520180_3840x2400-1000x600.jpg"/>
            </div>
        </div>

        <div class="slider-nav">
            <a href="#slide-1"></a>
            <a href="#slide-2"></a>
            <a href="#slide-3"></a>
        </div>
    </section>

    <script>
        // Optional: Add any JavaScript functionality to handle slide navigation
    </script>
</body>
</html>
