<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слайдер зображень</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80hv;
            /*width: 600px;*/
        }

        .slider {
            position: relative;
            width: 50%;
            max-width: 700px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease;
        }

        .slide {
            min-width: 100%;
            transition: opacity 1s ease;
        }

        .slide img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .nav-buttons {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }

        .nav-button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .nav-button:hover {
            opacity: 1;
        }

        progress-bar-container {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 2.5px;
        }

        .progress-bar {
            height: 100%;
            background-color: #ff6347;
            border-radius: 2.5px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .pause-button {
            position: absolute;
            bottom: 30px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .pause-button:hover {
            opacity: 1;
        }

        .paused {
            background-color: rgba(255, 0, 0, 0.7);
        }


    </style>
</head>
<body>

    <div class="slider">
        <div class="slides">
            <div class="slide">
                <img src="https://proslav.info/wp-content/uploads/2023/04/image-18.png" >
            </div>
            <div class="slide">
                <img src="https://www.prostolife.com.ua/wp-content/uploads/2024/06/illustrations_to_books_men_monsters_war_of_the_520180_3840x2400-1000x600.jpg" >
            </div>
            <div class="slide">
                <img src="https://static.wikia.nocookie.net/fantasticbeings/images/d/dd/8f8476310ab1.jpg/revision/latest?cb=20170515161017&path-prefix=ru" >
            </div>
            <div class="slide">
                <img src="https://cs12.pikabu.ru/post_img/big/2021/12/02/3/1638417058134985771.jpg">
            </div>
            <div class="slide">
                <img src="https://olympus-gods.com/wp-content/uploads/2024/08/Hephaestus.jpg" >
            </div>

            <div class="slide">
                <img src="https://prostir.center/pub/images/76adcb1e41436491.jpg" >
            </div>

            <div class="slide">
                <img src="https://static.wikia.nocookie.net/fantasticbeings/images/3/31/Dionis-2.jpg/revision/latest?cb=20220827055901&path-prefix=ru" >
            </div>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-button" id="prev">←</button>
            <button class="nav-button" id="next">→</button>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <button class="pause-button" id="pauseButton">Пауза</button>
    </div>

    <script>
        const slides = document.querySelector('.slides');
        const prevButton = document.getElementById('prev');
        const nextButton = document.getElementById('next');
        const totalSlides = document.querySelectorAll('.slide').length;

        let currentSlide = 0;

        // Функція для оновлення слайдера
        function updateSlider() {
            slides.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        // Кнопка попереднього слайду
        prevButton.addEventListener('click', () => {
            currentSlide = (currentSlide === 0) ? totalSlides - 1 : currentSlide - 1;
            updateSlider();
        });

        // Кнопка наступного слайду
        nextButton.addEventListener('click', () => {
            currentSlide = (currentSlide === totalSlides - 1) ? 0 : currentSlide + 1;
        });
         // Автоматичне перемикання слайдів через 3 секунди
         setInterval(() => {
            currentSlide = (currentSlide === totalSlides - 1) ? 0 : currentSlide + 1;
            updateSlider();
        }, 3000);

        if (pauseButton.classList.contains('paused')) {
                // Відновити автоматичний слайдер
                startAutoSlide();
                pauseButton.classList.remove('paused');
                pauseButton.textContent = 'Пауза';
            } else {
                // Зупинити автоматичний слайдер
                stopAutoSlide();
                pauseButton.classList.add('paused');
                pauseButton.textContent = 'Відновити';
            }

        // Ініціалізація слайдера
        updateSlider();
    </script>

</body>
</html>
